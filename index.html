<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>역사 쇼츠 프롬프트 입력 앱 v1.0</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1d232b;
      --muted: #667085;
      --line: #d9dee7;
      --accent: #176b5b;
      --accent-strong: #0f4f43;
      --warn: #8a4b07;
      --shadow: 0 8px 24px rgba(26, 33, 44, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(360px, 480px) minmax(420px, 1fr);
      gap: 0;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 20px;
      overflow: auto;
      max-height: 100vh;
    }

    .preview {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 21px;
      letter-spacing: 0;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .group {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      margin-top: 16px;
    }

    .group:first-of-type {
      border-top: 0;
      padding-top: 0;
      margin-top: 0;
    }

    .group-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #303846;
      font-size: 13px;
      font-weight: 650;
    }

    select,
    textarea,
    input[type="text"],
    input[type="file"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 10px 11px;
      outline: none;
    }

    select:focus,
    textarea:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 91, 0.14);
    }

    textarea {
      min-height: 94px;
      resize: vertical;
    }

    .compact {
      min-height: 52px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      min-height: 40px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    button.secondary {
      background: #fff;
      color: var(--accent);
    }

    button.secondary:hover {
      background: #eef7f4;
    }

    button.warning {
      border-color: #c9852f;
      background: #fff;
      color: var(--warn);
    }

    button.warning:hover {
      background: #fff5e8;
    }

    .status {
      min-height: 22px;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 650;
    }

    .output-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .output-toolbar h2 {
      margin: 0;
      font-size: 18px;
    }

    .output-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #output {
      width: 100%;
      min-height: 620px;
      flex: 1;
      border: 0;
      border-radius: 0;
      resize: none;
      padding: 16px;
      font-family: "Consolas", "SFMono-Regular", monospace;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .tool-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .tool-link:hover {
      border-color: var(--accent);
      color: var(--accent-strong);
      background: #eef7f4;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      #output {
        min-height: 460px;
      }
    }

    @media (max-width: 560px) {
      .sidebar,
      .preview {
        padding: 14px;
      }

      .two-col {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="sidebar" aria-label="입력 폼">
      <h1>역사 쇼츠 프롬프트 입력 v1.0</h1>
      <p class="lead">값을 입력하면 오른쪽에 USER INPUT 블록이 자동 생성됩니다.</p>

      <div class="group">
        <p class="group-title">마스터 프롬프트</p>
        <label for="masterFile">프롬프트 TXT 불러오기</label>
        <input id="masterFile" type="file" accept=".txt,text/plain">
        <p class="hint">배포된 앱에서는 v1.0 TXT를 자동으로 불러옵니다. 필요하면 다른 TXT를 직접 선택할 수 있습니다.</p>
      </div>

      <div class="group">
        <p class="group-title">외부 링크</p>
        <div class="link-grid" aria-label="AI 제작 도구 링크">
          <a class="tool-link" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT</a>
          <a class="tool-link" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini</a>
          <a class="tool-link" href="https://www.midjourney.com/" target="_blank" rel="noopener noreferrer">Midjourney</a>
          <a class="tool-link" href="https://runwayml.com/" target="_blank" rel="noopener noreferrer">Runway</a>
          <a class="tool-link" href="https://klingai.com/" target="_blank" rel="noopener noreferrer">Kling</a>
          <a class="tool-link" href="https://www.canva.com/" target="_blank" rel="noopener noreferrer">Canva</a>
        </div>
        <label for="customLink">사용자 지정 외부 링크</label>
        <input id="customLink" type="text" placeholder="https://example.com">
        <div class="actions">
          <button id="openCustomLink" class="secondary" type="button">링크 열기</button>
        </div>
      </div>

      <div class="group">
        <p class="group-title">1. 현대 여성 진행자 이미지</p>
        <label for="hostUploadStatus">이미지 업로드 여부</label>
        <select id="hostUploadStatus">
          <option value="아직 업로드하지 않음">아직 업로드하지 않음</option>
          <option value="업로드함">업로드함</option>
        </select>

        <label for="hostMode">이미지 사용 방식</label>
        <select id="hostMode">
          <option value="A) 업로드한 여성 이미지를 모든 장면에서 같은 진행자로 유지">A) 모든 장면에서 같은 진행자로 유지</option>
          <option value="B) 장면마다 다른 여성 이미지를 제공할 수 있음">B) 장면마다 다른 이미지 사용</option>
        </select>
      </div>

      <div class="group">
        <p class="group-title">2. 역사 인물</p>
        <label for="figure">2026년으로 데려올 한국 역사 인물</label>
        <select id="figure">
          <option value="">선택하세요</option>
          <option value="A) 세종대왕">A) 세종대왕</option>
          <option value="B) 이순신">B) 이순신</option>
          <option value="C) 장영실">C) 장영실</option>
          <option value="D) 정약용">D) 정약용</option>
          <option value="E) 신사임당">E) 신사임당</option>
          <option value="F) 허준">F) 허준</option>
          <option value="G) 선덕여왕">G) 선덕여왕</option>
          <option value="H) 광개토대왕">H) 광개토대왕</option>
          <option value="I) 안중근">I) 안중근</option>
          <option value="J) 유관순">J) 유관순</option>
          <option value="K">K) 직접 입력</option>
        </select>

        <label for="customFigure">직접 입력</label>
        <input id="customFigure" type="text" placeholder="예: 김홍도, 허난설헌">
      </div>

      <div class="group">
        <p class="group-title">3-4. 인물 디테일</p>
        <label for="appearance">역사 인물 외형 특징</label>
        <textarea id="appearance" placeholder="나이 인상, 얼굴 분위기, 머리/수염/장식, 의상, 자세, 피해야 할 외형 등을 적어주세요."></textarea>

        <label for="personality">역사 인물 말투 / 성격 특징</label>
        <textarea id="personality" placeholder="말투, 성격, 피해야 할 행동 등을 적어주세요."></textarea>
      </div>

      <div class="group">
        <p class="group-title">5-9. 출력 설정</p>
        <div class="two-col">
          <div>
            <label for="vibe">전체 분위기</label>
            <select id="vibe">
              <option value="A) 밝지만 품격 있는 브이로그 코미디">A) 밝지만 품격 있는 코미디</option>
              <option value="B) 혼란과 당황 리액션">B) 혼란과 당황 리액션</option>
              <option value="C) 감탄과 철학적 반응">C) 감탄과 철학적 반응</option>
              <option value="D) 블랙코미디와 아이러니">D) 블랙코미디와 아이러니</option>
              <option value="E) 시네마틱하고 감성적인 분위기">E) 시네마틱 감성</option>
            </select>
          </div>
          <div>
            <label for="duration">장면당 최대 길이</label>
            <select id="duration">
              <option value="A) 5초">A) 5초</option>
              <option value="B) 8초">B) 8초</option>
              <option value="C) 10초">C) 10초</option>
            </select>
          </div>
        </div>

        <label for="textLanguage">사용자용 텍스트 언어</label>
        <select id="textLanguage">
          <option value="A) 한국어" selected>A) 한국어</option>
          <option value="B) 영어">B) 영어</option>
          <option value="C) 한국어와 영어 모두">C) 한국어와 영어 모두</option>
        </select>

        <label for="promptLanguage">AI 생성 프롬프트 언어</label>
        <select id="promptLanguage">
          <option value="A) 영어로 출력" selected>A) 영어로 출력</option>
          <option value="B) 한국어로 출력">B) 한국어로 출력</option>
          <option value="C) 한국어와 영어 모두 출력">C) 한국어와 영어 모두 출력</option>
        </select>

        <label for="background">현대 배경</label>
        <select id="background">
          <option value="A) 서울 도심 거리">A) 서울 도심 거리</option>
          <option value="B) 광화문 / 궁궐 주변">B) 광화문 / 궁궐 주변</option>
          <option value="C) 지하철 / 대중교통">C) 지하철 / 대중교통</option>
          <option value="D) 대학교 / 도서관 / 박물관">D) 대학교 / 도서관 / 박물관</option>
          <option value="E) 병원 / 과학 연구실 / 기술 공간">E) 병원 / 과학 연구실 / 기술 공간</option>
          <option value="F) 현대 쇼핑 거리">F) 현대 쇼핑 거리</option>
          <option value="G) 역사 인물에 가장 잘 맞는 장소를 AI가 선택" selected>G) 역사 인물에 가장 잘 맞는 장소를 AI가 선택</option>
        </select>
      </div>

      <div class="group">
        <p class="group-title">10. 추가 요청 사항</p>
        <label for="extra">추가 요청</label>
        <textarea id="extra" class="compact" placeholder="특정 장소, 물건, 코미디 방향, 피하고 싶은 표현 등을 적어주세요."></textarea>
      </div>

      <div class="actions">
        <button id="copyInputs" type="button">입력값 복사</button>
        <button id="saveInputs" type="button">입력값 저장</button>
        <button id="loadInputs" class="secondary" type="button">저장 불러오기</button>
        <button id="downloadInputs" class="secondary" type="button">JSON 저장</button>
        <button id="resetInputs" class="warning" type="button">초기화</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="preview" aria-label="프롬프트 미리보기">
      <div class="output-toolbar">
        <h2>완성 프롬프트</h2>
        <div class="actions">
          <button id="copyPrompt" type="button">프롬프트 복사</button>
          <button id="downloadPrompt" class="secondary" type="button">프롬프트 TXT 저장</button>
        </div>
      </div>
      <div class="output-wrap">
        <textarea id="output" spellcheck="false" aria-label="완성 프롬프트"></textarea>
      </div>
    </section>
  </main>

  <script>
    const storageKey = "history-shorts-prompt-inputs-v1";
    const bundledPromptFile = "Korean Historical Selfie VLOG Script & Prompt Generator v1.0.txt";
    const fields = [
      "hostUploadStatus",
      "hostMode",
      "figure",
      "customFigure",
      "appearance",
      "personality",
      "vibe",
      "duration",
      "textLanguage",
      "promptLanguage",
      "background",
      "extra",
      "customLink"
    ];

    const els = Object.fromEntries(fields.map((id) => [id, document.getElementById(id)]));
    const output = document.getElementById("output");
    const statusEl = document.getElementById("status");
    let masterPrompt = "";

    function getValues() {
      return Object.fromEntries(fields.map((id) => [id, els[id].value.trim()]));
    }

    function normalizeValues(values) {
      const next = { ...values };

      if (next.language && !next.textLanguage && !next.promptLanguage) {
        if (next.language.startsWith("A)")) {
          next.textLanguage = "A) 한국어";
          next.promptLanguage = "B) 한국어로 출력";
        } else if (next.language.startsWith("B)")) {
          next.textLanguage = "B) 영어";
          next.promptLanguage = "A) 영어로 출력";
        } else if (next.language.startsWith("D)")) {
          next.textLanguage = "C) 한국어와 영어 모두";
          next.promptLanguage = "C) 한국어와 영어 모두 출력";
        } else {
          next.textLanguage = "A) 한국어";
          next.promptLanguage = "A) 영어로 출력";
        }
      }

      return next;
    }

    function setValues(values) {
      const normalized = normalizeValues(values);
      fields.forEach((id) => {
        if (Object.prototype.hasOwnProperty.call(normalized, id)) {
          els[id].value = normalized[id];
        }
      });
      render();
    }

    function getFigureText(values) {
      if (values.figure === "K") {
        return values.customFigure ? `K) 직접 입력: ${values.customFigure}` : "K) 직접 입력:";
      }
      return values.figure || "[선택하지 않음]";
    }

    function buildUserInput(values) {
      return `# USER INPUT / 사용자 입력란

아래 항목은 사용자가 직접 작성한 입력값입니다.
선택하지 않은 항목은 기본값으로 처리합니다.

---

## 1. 현대 여성 진행자 이미지

* 여성 진행자 레퍼런스 이미지 업로드 여부:
  * [${values.hostUploadStatus}]

* 이미지 사용 방식:
  * ${values.hostMode}

선택:
${values.hostMode}

기본값:
A) 업로드한 여성 이미지를 모든 장면에서 같은 진행자로 유지

---

## 2. 2026년으로 데려올 한국 역사 인물

선택:
${getFigureText(values)}

---

## 3. 역사 인물 외형 특징

입력:
${values.appearance || "[입력하지 않음]"}

---

## 4. 역사 인물 말투 / 성격 특징

입력:
${values.personality || "[입력하지 않음]"}

---

## 5. 전체 분위기

선택:
${values.vibe}

기본값:
A) 밝지만 품격 있는 브이로그 코미디

---

## 6. 장면당 최대 길이

선택:
${values.duration}

기본값:
A) 5초

---

## 7. 사용자용 텍스트 언어

선택:
${values.textLanguage}

기본값:
A) 한국어

---

## 8. AI 생성 프롬프트 언어

선택:
${values.promptLanguage}

기본값:
A) 영어로 출력

---

## 9. 현대 배경

선택:
${values.background}

기본값:
G) 역사 인물에 가장 잘 맞는 장소를 AI가 선택

---

## 10. 추가 요청 사항

입력:
${values.extra || "[입력하지 않음]"}

---

## 11. 최종 실행 지시

위 USER INPUT을 기준으로 결과물을 생성하라.

반드시 다음을 포함하라:

1. 전체 쇼츠 대본
2. 장면별 대사
3. 장면별 상황 설명
4. 장면별 Image Prompt
5. 장면별 Video Prompt
6. 장면별 Negative Prompt
7. 장면별 자막 문구
8. 편집 노트
9. 제목 후보
10. 썸네일 문구
11. 고정 댓글
12. 제작 체크리스트

Image Prompt, Video Prompt, Negative Prompt는 사용자가 선택한 AI 생성 프롬프트 언어 기준을 따르라.

대본, 자막, 제목, 썸네일 문구, 고정 댓글은 사용자가 선택한 사용자용 텍스트 언어 기준을 따르라.

역사 인물 외형 특징과 역사 인물 말투 / 성격 특징이 입력되어 있다면 반드시 모든 장면의 대본, Image Prompt, Video Prompt, Negative Prompt에 반영하라.`;
    }

    function replaceUserInputBlock(prompt, userInput) {
      const marker = "# USER INPUT / 사용자 입력란";
      const index = prompt.indexOf(marker);
      if (index === -1) {
        return `${prompt.trim()}\n\n---\n\n${userInput}`;
      }
      return `${prompt.slice(0, index).trimEnd()}\n\n${userInput}`;
    }

    function render() {
      const values = getValues();
      const userInput = buildUserInput(values);
      output.value = masterPrompt ? replaceUserInputBlock(masterPrompt, userInput) : userInput;
    }

    async function loadBundledPrompt() {
      try {
        const response = await fetch(encodeURI(bundledPromptFile));
        if (!response.ok) return;
        masterPrompt = await response.text();
        render();
        showStatus("v1.0 마스터 프롬프트를 자동으로 불러왔습니다.");
      } catch {
        render();
      }
    }

    function showStatus(message) {
      statusEl.textContent = message;
      window.clearTimeout(showStatus.timer);
      showStatus.timer = window.setTimeout(() => {
        statusEl.textContent = "";
      }, 2400);
    }

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
        showStatus(message);
      } catch {
        const temp = document.createElement("textarea");
        temp.value = text;
        temp.style.position = "fixed";
        temp.style.left = "-9999px";
        document.body.appendChild(temp);
        temp.focus();
        temp.select();
        document.execCommand("copy");
        temp.remove();
        showStatus(message);
      }
    }

    function downloadText(filename, text, type = "text/plain;charset=utf-8") {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("masterFile").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        masterPrompt = String(reader.result || "");
        render();
        showStatus("마스터 프롬프트를 불러왔습니다.");
      };
      reader.readAsText(file, "utf-8");
    });

    fields.forEach((id) => {
      els[id].addEventListener("input", render);
      els[id].addEventListener("change", render);
    });

    document.getElementById("copyInputs").addEventListener("click", () => {
      copyText(buildUserInput(getValues()), "입력값을 복사했습니다.");
    });

    document.getElementById("copyPrompt").addEventListener("click", () => {
      copyText(output.value, "완성 프롬프트를 복사했습니다.");
    });

    document.getElementById("saveInputs").addEventListener("click", () => {
      localStorage.setItem(storageKey, JSON.stringify(getValues(), null, 2));
      showStatus("입력값을 브라우저에 저장했습니다.");
    });

    document.getElementById("loadInputs").addEventListener("click", () => {
      const saved = localStorage.getItem(storageKey);
      if (!saved) {
        showStatus("저장된 입력값이 없습니다.");
        return;
      }
      setValues(JSON.parse(saved));
      showStatus("저장된 입력값을 불러왔습니다.");
    });

    document.getElementById("downloadInputs").addEventListener("click", () => {
      downloadText("history-shorts-inputs.json", JSON.stringify(getValues(), null, 2), "application/json;charset=utf-8");
      showStatus("입력값 JSON을 저장했습니다.");
    });

    document.getElementById("downloadPrompt").addEventListener("click", () => {
      downloadText("history-shorts-final-prompt.txt", output.value);
      showStatus("완성 프롬프트 TXT를 저장했습니다.");
    });

    document.getElementById("openCustomLink").addEventListener("click", () => {
      const rawUrl = els.customLink.value.trim();
      if (!rawUrl) {
        showStatus("열 외부 링크를 입력해주세요.");
        return;
      }
      const url = /^https?:\/\//i.test(rawUrl) ? rawUrl : `https://${rawUrl}`;
      window.open(url, "_blank", "noopener,noreferrer");
      showStatus("외부 링크를 새 탭으로 열었습니다.");
    });

    document.getElementById("resetInputs").addEventListener("click", () => {
      const defaults = {
        hostUploadStatus: "아직 업로드하지 않음",
        hostMode: "A) 업로드한 여성 이미지를 모든 장면에서 같은 진행자로 유지",
        figure: "",
        customFigure: "",
        appearance: "",
        personality: "",
        vibe: "A) 밝지만 품격 있는 브이로그 코미디",
        duration: "A) 5초",
        textLanguage: "A) 한국어",
        promptLanguage: "A) 영어로 출력",
        background: "G) 역사 인물에 가장 잘 맞는 장소를 AI가 선택",
        extra: "",
        customLink: ""
      };
      setValues(defaults);
      showStatus("입력값을 초기화했습니다.");
    });

    render();
    loadBundledPrompt();
  </script>
</body>
</html>
